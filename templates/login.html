
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>دخول المسؤول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #10131c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #1c2230;
            padding: 30px;
            border-radius: 14px;
            width: 85%;
            max-width: 360px;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border-radius: 7px;
        }
        input {
            background: #10131c;
            color: white;
            border: 1px solid #444;
        }
        button {
            background: #c49b50;
            border: 0;
            font-weight: bold;
        }
        .error { color: #ff7777; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>لوحة تحكم BENSAOULA</h2>
        <p>تسجيل دخول المسؤول</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <input type="password" name="password"
                   placeholder="كلمة المرور" required>

            <button type="submit">تسجيل الدخول</button>
        </form>
    </div>
</body>
</html>
